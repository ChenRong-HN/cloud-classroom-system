server:
  port: 10010
spring:
  application:
    name: yanque-ykt-gateway-service # 项目名称(注册到Nacos中)
  cloud:
    nacos:
      server-addr: 192.168.8.5:8848 # Nacos注册中心
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*" # 允许所有来源
            allow-credentials: true      # 允许携带凭证
            allowed-headers: "*"         # 允许所有头
            allowedMethods:
              - GET
              - POST
              - DELETE
              - PUT
              - PATCH
              - OPTIONS
              - HEAD
              - CONNECT
              - TRACE
      routes:
        - id: yanque-ykt-system-service # 路由规则名称
          uri: lb://yanque-ykt-system-service # 转发目标
          predicates:
            - Path=/ykt/system/** # 路由匹配规则
          filters:
            - StripPrefix=1 # 默认将访问路径中的第一部分截取,只保留后续部分进行转发
        - id: yanque-ykt-uaa-service # 路由规则名称
          uri: lb://yanque-ykt-uaa-service # 转发目标
          predicates:
            - Path=/ykt/uaa/** # 路由匹配规则
          filters:
            - StripPrefix=1 # 默认将访问路径中的第一部分截取,只保留后续部分进行转发
        - id: yanque-ykt-user-service # 路由规则名称
          uri: lb://yanque-ykt-user-service # 转发目标
          predicates:
            - Path=/ykt/user/** # 路由匹配规则
          filters:
            - StripPrefix=1 # 默认将访问路径中的第一部分截取,只保留后续部分进行转发
        - id: yanque-ykt-common-service # 路由规则名称
          uri: lb://yanque-ykt-common-service # 转发目标
          predicates:
            - Path=/ykt/common/** # 路由匹配规则
          filters:
            - StripPrefix=1 # 默认将访问路径中的第一部分截取,只保留后续部分进行转发
        - id: yanque-ykt-course-service # 路由规则名称
          uri: lb://yanque-ykt-course-service # 转发目标
          predicates:
            - Path=/ykt/course/** # 路由匹配规则
          filters:
            - StripPrefix=1 # 默认将访问路径中的第一部分截取,只保留后续部分进行转发