server:
  port: 10010
spring:
  application:
    name: yanque-ykt-gateway-service # 项目名称(注册到Nacos中)
  cloud:
    nacos:
      server-addr: 192.168.8.5:8848 # Nacos注册中心
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*" # 允许所有来源
            allow-credentials: true      # 允许携带凭证
            allowed-headers: "*"         # 允许所有头
            allowedMethods:
              - GET
              - POST
              - DELETE
              - PUT
              - PATCH
              - OPTIONS
              - HEAD
              - CONNECT
              - TRACE